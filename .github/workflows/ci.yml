name: CI

# Type-check + build + run tests on every pull request, so a change that
# doesn't compile or breaks a test can't reach `main`. The job name (`build`)
# is what you select as a required status check in the branch ruleset — see
# the finish-setup skill. Kept as one job/one name so the existing required
# check still covers everything, rather than adding a second check to select.
#
# `npm run test:e2e` runs Playwright against the live Supabase project (see
# docs/system-design.md) — every PR now creates and cleans up real rows, so
# a scenario that used to need the user's phone runs unattended on every PR.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
